name: Validate ETHOS themes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt
      - name: Install validation dependencies
        run: python -m pip install -r tools/requirements-dev.txt
      - name: Run regression tests
        run: python -m unittest discover -s tools -p "test_*.py" -v
      - name: Validate themes, images, manifests, and releases
        run: python tools/validate_catalog.py
